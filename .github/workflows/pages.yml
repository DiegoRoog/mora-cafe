name: Publish Mora Café to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mora-cafe/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: mora-cafe
      - run: npm run build
        working-directory: mora-cafe
        env:
          NEXT_PUBLIC_GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /mora-cafe
          NEXT_PUBLIC_SITE_URL: https://diegoroog.github.io
      - uses: actions/upload-pages-artifact@v4
        with:
          path: mora-cafe/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
